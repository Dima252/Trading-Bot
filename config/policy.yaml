# FROZEN CONFIGURATION -- do not edit during the paper trial.
#
# This is `risk_1p6`, the only configuration in this project with out-of-sample
# evidence. On the holdout period (2025-06-11 -> 2026-08-27), which informed no
# decision before it was spent:
#
#     CAGR 12.20%   max drawdown 6.83%   return/DD 1.79   +8pp over cash
#     expectancy +0.127R, against +0.120R in-fold -- a drift of +0.007R
#
# That stability between in-fold and unseen data is the evidence. It is worth
# more than the level, and it is exactly what `all_three` failed: +0.169R
# in-fold across 4/4 folds, then NEGATIVE (-0.132R) out of sample.
#
# Every edit to this file discards that evidence and leaves an unvalidated
# system with no clean test left to earn it back. That includes changes that
# look obviously correct -- see PLAN.md section 5d for the stopping rule.
#
# Frozen 2026-08-28.

version: v2-holdout

# --- risk limits (the constitution) ---
max_risk_per_trade: 0.016                 # 1.6% -- the scaled envelope
max_portfolio_heat: 0.096                 # total open risk across all positions
max_sector_exposure: 0.25
max_position_pct: 0.24                    # scaled with the envelope
min_cash_reserve: 0.1
max_new_positions_per_day: 3
daily_loss_breaker: -0.03
weekly_loss_breaker: -0.06

# --- regime gate ---
tradeable_regimes: [trend]                # opens positions in trend only; exits always run

# --- exit rules ---
time_stop_days: 40                        # lengthened -- the 10-day stop cut winners short
time_stop_min_r: 0.5
max_hold_days: 60
trail_trigger_r: 1.5
trail_atr_mult: 2.0

# --- rotation and allocation ---
switching_premium: 1.3
min_candidate_score: 40.0
min_risk_fraction: 0.5
max_entry_chase_pct: 0.02

# --- setup tunables ---
pullback_favour_shallow: true             # rsi z=+16.4, depth z=-12.1: signs inverted
pullback_w_trend: 0.4
pullback_w_reset: 0.35
pullback_w_depth: 0.25

# --- scoring weights ---
w_setup: 0.6
w_regime: 0.2
w_rr: 0.2
w_event: 0.5
rr_cap: 3.0
stale_score_decay: 0.9
w_performance: 5.0

# Regime fit priors. KNOWN LIMITATION: never validated, and inert under
# the trend-only gate since only the `trend` column is ever consulted.
# Left untouched deliberately -- changing it changes the tested system.
regime_fit:
  breakout:
    trend: 1.0
    chop: 0.3
    high_vol: 0.5
  pullback:
    trend: 0.9
    chop: 0.6
    high_vol: 0.4
  mean_reversion:
    trend: 0.4
    chop: 0.9
    high_vol: 0.5
